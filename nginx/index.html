<!DOCTYPE html>
<html>

<head>
  <title>Sonnen SmartSwitch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/app.css">
</head>

<body>
  <h1>Sonnen SmartSwitch</h1>
  <p>(Release: <span name="release_tag"></span>)</p>
  <fieldset>
    <legend>Status</legend>
    <div class="container">
      <div>
        <div>Switch: <span class="switch" name="switch" data-value="false"></span></div>
        <div>Production: <span name="prod"></span> W</div>
        <div>Consumption: <span name="cons_w"></span> W</div>
        <div>Consumption (avg): <span name="cons_avg_w"></span> W</div>
        <div>Grid: <span name="grid"></span> W</div>
        <div>Events (<a href="javascript:showLog();">Log</a>): <span name="events"></span></div>
        <div id="overlay" class="overlay">
          <div class="overlay-content">
            <button id="closeOverlay" onclick="javascript:closeLog();">Close</button>
            <ul id="eventLog" class="eventLog"></ul>
          </div>
        </div>
      </div>
      <div class="battery-container">
        <div class="battery">
          <input hidden name="usoc" id="usoc">
          <div class="charge" id="charge"></div>
          <span class="charge-lvl" id="charge-lvl">0%</span>
        </div>
      </div>
  </fieldset>
  </div>
  <form class="form-container">
    <fieldset>
      <legend>Mode</legend>
      <label><input type="radio" name="mode" value="0">Off</label><br />
      <label><input type="radio" name="mode" value="1">On</label><br />
      <label><input type="radio" name="mode" value="2">Auto</label><br />
    </fieldset>
  </form>
  <form action="/api/update" method="post" class="form-container">
    <fieldset>
      <legend>Boiler</legend>
      <div class="form-group">
        <label for="bs_t_cur">T (C°):</label>
        <input id="bs_t_cur" name="bs_t_cur" readonly disabled>
      </div>
      <div class="form-group">
        <label for="bs_t_max">T_max (C°):</label>
        <input id="bs_t_max" name="bs_t_max" maxlength="4">
      </div>
      <div class="form-group">
        <label for="bs_t_nom">T_min (C°):</label>
        <input id="bs_t_nom" name="bs_t_nom" maxlength="4">
      </div>
      <button type="submit" name="boiler" value="Update">Update</button>
    </fieldset>
  </form>
  <form action="/api/update" method="post" class="form-container">
    <fieldset>
      <legend>Sonnen Battery</legend>
      <div class="form-group">
        <label for="sn_host">Host:</label>
        <input id="sn_host" name="sn_host">
      </div>
      <div class="form-group">
        <label for="sn_token">Token:</label>
        <input id="sn_token" type="password" name="sn_token" maxlength="36">
      </div>
      <div class="form-group">
        <label for="sn_grdmin">Grid_min (W):</label>
        <input id="sn_grdmin" name="sn_grdmin" maxlength="4">
      </div>
      <div class="form-group">
        <label for="sn_loadpower">Load (W):</label>
        <input id="sn_loadpower" name="sn_loadpower" maxlength="4">
      </div>
      <div class="form-group">
        <label for="sn_cap_min">Capacity min (Wh):</label>
        <input id="sn_cap_min" name="sn_cap_min" maxlength="6">
      </div>
      <button type="submit" name="sonnen" value="Update">Update</button>
    </fieldset>
  </form>
  <form action="/api/update" method="post" class="form-container">
    <fieldset>
      <legend>PV Location</legend>
      <div class="form-group">
        <label for="loc">Location:</label>
        <input id="loc" name="loc" readonly disabled></span>
      </div>
      <div class="form-group">
        <label for="lc_lat">Latitude:</label>
        <input id="lc_lat" name="lc_lat" maxlength="8">
      </div>
      <div class="form-group">
        <label for="lc_lon">Longitude:</label>
        <input id="lc_lon" name="lc_lon" maxlength="8">
      </div>
      <div class="form-group">
        <label for="lc_az">Azimuth (0...360):</label>
        <input id="lc_az" name="lc_az" size="3" maxlength="3">
      </div>
      <div class="form-group">
        <label for="lc_kWp">kWp:</label>
        <input id="lc_kWp" name="lc_kWp">
      </div>
      <button type="submit" name="location" value="Update">Update</button>
    </fieldset>
  </form>
  <form action="api/update" method="post" onSubmit="return confirm('Sure?');" class="form-container">
    <fieldset>
      <legend>Software Update</legend>
      Git Release: <a href="/api/update?update">Update Check</a><br />
      <label>Update-Check on startup:</label>
      <input type="radio" name="update_startup" value="0">Off
      <input type="radio" name="update_startup" value="1">On
    </fieldset>
  </form>
  <form action="api/update" method="post" class="form-container">
    <fieldset>
      <legend>Network</legend>
      <div>
        <label for="hostname">Hostname:</label>
        <input name="hostname">
      </div>
      <button type="submit">Update</button>
    </fieldset>
  </form>
  <form action="/api/update" method="post">
    <fieldset>
      <legend>System</legend>
      <input type="submit" name="restart" value="Restart" />
      <input type="submit" name="reset" value="Factory Reset" onclick="return confirm('Sure? WLAN Access Data will be erased!');">
    </fieldset>
  </form>
  <script src="/app.js" defer></script>
</body>

</html>
