<html>
<head>
  <title>Sonnen SmartSwitch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    fieldset {
      border: 2px solid #333;
      padding: 8px;
      border-radius: 5px;
    }
    button {
      padding: 4px;
    }
    input[type="radio"] {
      accent-color: #007BFF;
      width: 18px;
      height: 18px;
    }
    body {
      background: #ffffff;
      color: #333;
    }
    body,
    input,
    button {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      margin: 4px;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-color-scheme: dark) {
      body,
      input,
      button {
        background: #222;
        color: #fcf8bf;
      }
    }
    .form-container {
      width: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .form-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    legend {
      font-weight: bold;
    }
    label {
      width: 100px;
      text-align: left;
      margin-right: 10px;
    }
    input {
      flex: 1;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .container {
      display: grid;
      grid-template-columns: 75% 25%;
      gap: 10px;
    }
    .battery-container {
      text-align: center;
      font-family: Arial, sans-serif;
    }
    .battery {
      width: 75px;
      height: 150px;
      border: 4px solid #333;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      background-color: #eee;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .battery::after {
      content: "";
      width: 25px;
      height: 8px;
      background-color: #333;
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 3px;
    }
    .charge {
      width: 100%;
      height: 0%;
      position: absolute;
      bottom: 0;
      transition: height 0.5s ease-in-out, background-color 0.5s;
    }

    .charge-lvl {
      color: rgb(7, 68, 124);
      font-weight: bold;
      text-align: center;
      display: flex;
      align-items: center;
      position: absolute;
      z-index: 2
    }
    .charge[data-level="high"] {
      background-color: #28a745;
    }
    .charge[data-level="medium"] {
      background-color: #ffc107;
      color: black;
    }
    .charge[data-level="low"] {
      background-color: #dc3545;
    }
  </style>
</head>

<body>
  <h1>Sonnen SmartSwitch</h1>
  <p>(Release: <span name="release_tag"></span>)</p>
  <fieldset>
    <legend>Status</legend>
    <div class="container">
      <div>
        <label for="switch">Switch:</label><b name="switch"></b><br />
        <label for="prod">Production:</label><span name="prod"></span> W<br />
        <label for="cons_w">Consumption:</label><span name="cons_w"></span> W<br />
        <label for="cons_avg_w">Consumption (avg):</label><span name="cons_avg_w"></span> W<br />
        <label for="grid">Grid:</label><span name="grid"></span> W<br />
        <label for="events">Events:</label><span name="events"></span>
      </div>
      <div class="battery-container">
        <div class="battery">
          <input hidden name="usoc" id="usoc">
          <div class="charge" id="charge"></div>
          <span class="charge-lvl" id="charge-lvl">0%</span>
        </div>
      </div>
  </fieldset>
  </div>
  <form class="form-container">
    <fieldset>
      <legend>Mode</legend>
      <label><input type="radio" name="mode" value="0">Off</label><br />
      <label><input type="radio" name="mode" value="1">On</label><br />
      <label><input type="radio" name="mode" value="2">Auto</label><br />
    </fieldset>
  </form>
  <form action="/api/update" method="post" class="form-container">
    <fieldset>
      <legend>Boiler</legend>
      <div class="form-group">
        <label for="bs_t_cur">T (C°):</label>
        <input name="bs_t_cur" readonly disabled>
      </div>
      <div class="form-group">
        <label for="bs_t_max">T_max (C°):</label>
        <input name="bs_t_max" maxlength="4">
      </div>
      <div class="form-group">
        <label for="bs_t_nom">T_min (C°):</label>
        <input name="bs_t_nom" maxlength="4">
      </div>
      <button type="submit" name="boiler" value="Update">Update</button>
    </fieldset>
  </form>
  <form action="/api/update" method="post" class="form-container">
    <fieldset>
      <legend>Sonnen Battery</legend>
      <div class="form-group">
        <label for="sn_host">Host:</label>
        <input name="sn_host">
      </div>
      <div class="form-group">
        <label for="sn_token">Token:</label>
        <input type="password" name="sn_token" maxlength="36">
      </div>
      <div class="form-group">
        <label for="sn_grdmin">Grid_min (W):</label>
        <input name="sn_grdmin" maxlength="4">
      </div>
      <div class="form-group">
        <label for="sn_loadpower">Load (W):</label>
        <input name="sn_loadpower" maxlength="4">
      </div>
      <div class="form-group">
        <label for="sn_cap_min">Capacity min (Wh):</label>
        <input name="sn_cap_min" maxlength="6">
      </div>
      <button type="submit" name="sonnen" value="Update">Update</button>
    </fieldset>
  </form>
  <form action="/api/update" method="post" class="form-container">
    <fieldset>
      <legend>PV Location</legend>
      <div class="form-group">
        <label for="loc">Location:</label>
        <input name="loc" readonly disabled></span>
      </div>
      <div class="form-group">
        <label for="lc_lat">Latitude:</label>
        <input name="lc_lat" maxlength="8">
      </div>
      <div class="form-group">
        <label for="lc_lon">Longitude:</label>
        <input name="lc_lon" maxlength="8">
      </div>
      <div class="form-group">
        <label for="lc_az">Azimuth (0...360):</label>
        <input name="lc_az" size="3" maxlength="3">
      </div>
      <div class="form-group">
        <label for="lc_kWp">kWp:</label>
        <input name="lc_kWp">
      </div>
      <button type="submit" name="location" value="Update">Update</button>
    </fieldset>
  </form>
  <form action="api/update" method="post" onSubmit="return confirm('Sure?');" class="form-container">
    <fieldset>
      <legend>Software Update</legend>
      Git Release: <a href="/api/update?update">Update Check</a><br />
    </fieldset>
  </form>
  <form>
    <fieldset>
      <legend>Update-Check on startup</legend>
      <label><input type="radio" name="update_startup" value="0">Off</label><br />
      <label><input type="radio" name="update_startup" value="1">On</label><br />
    </fieldset>
  </form>
  <form action="/api/update" method="post" onSubmit="return confirm('Sure? WLAN Access Data will be erased!');">
    <fieldset>
      <legend>Factory Reset</legend><input type="submit" name="reset" value="Reset" />
    </fieldset>
  </form>
  <script src="/app.js" defer></script>
</body>
</html>
