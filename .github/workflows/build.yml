---
name: Build Sonnen SmartSwitch Release
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build ESP32 and ESP8266 firmware
        run: |
          cd smartswitch.espxx
          pio run -e esp32
          pio run -e esp8266

      - name: Rename firmware files
        run: |
          cd smartswitch.espxx
          mv .pio/build/esp8266/firmware.bin .pio/build/smartswitch.esp8266.ino.bin
          mv .pio/build/esp32/firmware.bin .pio/build/smartswitch.esp32.ino.bin
          gzip -9 -k .pio/build/smartswitch.esp8266.ino.bin
          gzip -9 -k .pio/build/smartswitch.esp32.ino.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartswitch-artifacts
          path: |
            smartswitch.espxx/.pio/build/smartswitch.esp8266.ino.bin.gz
            smartswitch.espxx/.pio/build/smartswitch.esp32.ino.bin.gz
          retention-days: 1 # delete after build

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: smartswitch-artifacts
          path: .

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          body: Automatically generated release ${{ github.run_number }}
          draft: false
          prerelease: false
          artifactContentType: "application/gzip"
          artifacts: |
            smartswitch.esp8266.ino.bin.gz
            smartswitch.esp32.ino.bin.gz
