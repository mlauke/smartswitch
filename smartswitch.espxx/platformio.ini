; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32]
platform = espressif32@^7.0.1
# board = upesy_wroom
board = wemos_d1_mini32
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
framework = arduino
upload_speed= 460800
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
#build_flags=-DDEBUG_ENABLED -DDEBUG_ESP_HTTP_CLIENT -DDEBUG_ESP_PORT=Serial
#build_flags=-DDEBUG_ENABLED -DDEBUG_LPB -DDEBUG_ESP_PORT=Serial
#build_flags=-DDEBUG_ENABLED
#build_flags=-DDEBUG_ENABLED -DDEBUG_ESP_HTTP_CLIENT -DDEBUG_ESP_PORT=Serial -DDEBUG_LPB
#build_flags=--DCORE_DEBUG_LEVEL=3 -DARDUINO_RUNNING_CORE=1 -DARDUINO_EVENT_RUNNING_CORE=0
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	tzapu/WiFiManager@^2.0.17

[env:esp8266]
platform = espressif8266
board = d1_mini
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
framework = arduino
upload_speed= 460800
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
#build_flags=-DDEBUG_ENABLED -DDEBUG_ESP_HTTP_CLIENT -DDEBUG_ESP_PORT=Serial -DDEBUG_ESP_HTTP_UPDATE
build_flags=-DDEBUG_ENABLED
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	tzapu/WiFiManager@^2.0.17

[env:native]
platform = native
test_framework = unity
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
build_type = debug
lib_compat_mode=strict
test_build_src = no
debug_test = *
debug_init_break = no
build_flags=-O0 -fno-inline -fno-omit-frame-pointer -fno-lto -fno-optimize-sibling-calls -fno-tree-sra -fno-tree-dce -DDEBUG_ENABLED

[platformio]
description = Sonnen Smartswitch
